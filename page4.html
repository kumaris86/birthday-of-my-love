<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>ভিডিও বার্তা 🎬</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .video-wrapper{max-width:620px;width:100%}
    .section-header{text-align:center;margin-bottom:24px}

    /* Video Slider */
    .vid-slider-outer{width:100%;overflow:hidden;border-radius:20px}
    .vid-slider-track{
      display:flex;
      transition:transform 0.5s cubic-bezier(0.25,0.46,0.45,0.94);
      will-change:transform;
    }
    .vid-slide{flex:0 0 auto;box-sizing:border-box}

    .video-card{
      background:var(--bg-card);
      border:1px solid var(--border-soft);
      border-radius:20px;
      overflow:hidden;
      backdrop-filter:blur(8px);
    }

    /* Streamable iframe */
    .vid-iframe-wrap{
      position:relative;
      width:100%;
      padding-bottom:56.25%; /* 16:9 */
      background:#000;
    }
    .vid-iframe-wrap iframe{
      position:absolute;
      top:0;left:0;
      width:100%;height:100%;
      border:none;
    }

    .video-caption{padding:16px 20px;border-top:1px solid var(--border-soft)}
    .video-caption p{text-align:left;font-size:0.92rem;color:var(--text-soft);line-height:1.7;font-style:italic}
    .video-title{font-family:'Dancing Script',cursive;font-size:1.1rem;color:var(--accent-gold);margin-bottom:6px;font-style:normal}

    /* Nav */
    .vid-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:18px}
    .vid-nav-btn{
      background:var(--bg-card);border:1px solid var(--border-soft);
      border-radius:50%;width:52px;height:52px;
      font-size:1.2rem;color:var(--accent-pink);
      cursor:pointer;transition:all 0.25s ease;
      display:flex;align-items:center;justify-content:center;
      -webkit-tap-highlight-color:transparent;touch-action:manipulation;
    }
    .vid-nav-btn:hover{background:rgba(244,167,185,0.15);transform:scale(1.08)}
    .vid-nav-btn:disabled{opacity:0.3;cursor:default;transform:none}
    .vid-counter{font-size:0.88rem;color:var(--text-dim);min-width:56px;text-align:center}

    /* dots */
    .vid-dots{display:flex;justify-content:center;gap:10px;margin-top:12px}
    .vid-dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim);transition:all 0.3s ease;cursor:pointer}
    .vid-dot.active{background:var(--accent-pink);transform:scale(1.4)}

    @media(max-height:500px) and (orientation:landscape){
      .vid-iframe-wrap{padding-bottom:46%}
    }
    @media(max-width:400px){
      .video-caption{padding:12px 14px}
    }
  </style>
</head>
<body style="opacity:0">
  <div class="stars-bg" aria-hidden="true"></div>
  <div class="page-indicator">4 / 5</div>

  <!-- 🎵 Kabira Encore -->
  <div class="music-player" id="musicPlayer">
    <button class="music-btn" id="playBtn" aria-label="সুর চালাও">▶</button>
    <span class="music-label" id="musicLabel">সুর চালাও</span>
  </div>

  <div class="page-wrapper" style="padding-top:40px;padding-bottom:40px">
    <div class="content-layer video-wrapper">
      <div class="section-header fade-in">
        <span style="font-size:2rem;display:block;margin-bottom:8px" aria-hidden="true">🎬</span>
        <h2>এটা শুধু তোমার জন্য</h2>
        <div class="divider"></div>
        <p>টাইপ করে বোঝানো যাচ্ছিল না, তাই…</p>
      </div>

      <div class="vid-slider-outer fade-in" id="vidOuter">
        <div class="vid-slider-track" id="vidTrack"></div>
      </div>

      <div class="vid-dots" id="vidDots"></div>

      <div class="vid-nav fade-in">
        <button class="vid-nav-btn" id="vidPrev" aria-label="আগের ভিডিও">←</button>
        <span class="vid-counter" id="vidCounter">1 / 2</span>
        <button class="vid-nav-btn" id="vidNext" aria-label="পরের ভিডিও">→</button>
      </div>

      <div class="nav-row fade-in" style="margin-top:28px">
        <button class="btn btn-primary" onclick="goToPage('page5.html')">শেষ কথাটা →</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    /* =============================================
       🎬 Streamable embed ID গুলো এখানে আছে
       wqjam8 = message (ভিডিও ১)
       cb5hpi = message2 (ভিডিও ২)
       ============================================= */
    const VIDEOS = [
      {
        embedId: 'wqjam8',
        title:   'তোমার জন্য — ১',
        caption: 'আমার জীবনের স্পেশাল মানুষটাকে স্পেশাল ফিল করানোর ক্ষুদ্র চেষ্টা।'
      },
      {
        embedId: 'cb5hpi',
        title:   'তোমার জন্য — ২',
        caption: 'কিছু কথা মুখে বলা যায় না — তাই আবার বলার চেষ্টা করলাম।'
      }
    ];

    let vidCurrent = 0;
    const vidOuter   = document.getElementById('vidOuter');
    const vidTrack   = document.getElementById('vidTrack');
    const vidDots    = document.getElementById('vidDots');
    const vidCounter = document.getElementById('vidCounter');
    const vidPrev    = document.getElementById('vidPrev');
    const vidNext    = document.getElementById('vidNext');

    function getVidWidth(){ return vidOuter.getBoundingClientRect().width; }

    function setWidths(){
      const w = getVidWidth();
      document.querySelectorAll('.vid-slide').forEach(s => s.style.width = w + 'px');
      vidTrack.style.transition = 'none';
      vidTrack.style.transform  = `translateX(-${vidCurrent * getVidWidth()}px)`;
      requestAnimationFrame(() => {
        vidTrack.style.transition = 'transform 0.5s cubic-bezier(0.25,0.46,0.45,0.94)';
      });
    }

    function buildVideos(){
      vidTrack.innerHTML = '';
      vidDots.innerHTML  = '';

      VIDEOS.forEach((vid, i) => {
        const slide = document.createElement('div');
        slide.className = 'vid-slide';

        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
          <div class="vid-iframe-wrap">
            <iframe
              src="https://streamable.com/e/${vid.embedId}?loop=1"
              frameborder="0"
              allowfullscreen
              allow="autoplay; fullscreen"
              loading="lazy"
              title="${vid.title}"
            ></iframe>
          </div>
          <div class="video-caption">
            <p class="video-title">${vid.title}</p>
            <p>${vid.caption}</p>
          </div>`;
        slide.appendChild(card);
        vidTrack.appendChild(slide);

        const dot = document.createElement('div');
        dot.className = 'vid-dot' + (i === 0 ? ' active' : '');
        dot.addEventListener('click', () => goVid(i));
        vidDots.appendChild(dot);
      });

      requestAnimationFrame(() => { setWidths(); updateVidUI(); });
    }

    function updateVidUI(){
      const w = getVidWidth();
      vidTrack.style.transform = `translateX(-${vidCurrent * w}px)`;
      vidCounter.textContent   = `${vidCurrent + 1} / ${VIDEOS.length}`;
      vidPrev.disabled = (vidCurrent === 0);
      vidNext.disabled = (vidCurrent === VIDEOS.length - 1);
      document.querySelectorAll('.vid-dot').forEach((d, i) =>
        d.classList.toggle('active', i === vidCurrent)
      );
    }

    function goVid(index){
      vidCurrent = Math.max(0, Math.min(VIDEOS.length - 1, index));
      updateVidUI();
    }

    vidPrev.addEventListener('click', () => goVid(vidCurrent - 1));
    vidNext.addEventListener('click', () => goVid(vidCurrent + 1));
    window.addEventListener('resize', () => { setWidths(); updateVidUI(); });

    /* Swipe */
    let tx = 0, ty = 0, horiz = false;
    vidOuter.addEventListener('touchstart', e => {
      tx = e.changedTouches[0].clientX;
      ty = e.changedTouches[0].clientY;
      horiz = false;
    }, {passive:true});
    vidOuter.addEventListener('touchmove', e => {
      const dx = Math.abs(e.changedTouches[0].clientX - tx);
      const dy = Math.abs(e.changedTouches[0].clientY - ty);
      if (!horiz && dx > dy && dx > 8) horiz = true;
    }, {passive:true});
    vidOuter.addEventListener('touchend', e => {
      if (!horiz) return;
      const dx = e.changedTouches[0].clientX - tx;
      if (Math.abs(dx) > 44) goVid(dx < 0 ? vidCurrent + 1 : vidCurrent - 1);
      horiz = false;
    }, {passive:true});

    document.addEventListener('DOMContentLoaded', () => {
      buildVideos();
      initYouTubePlayer('lwLVJ0E8gN4'); /* Kabira Encore */
    });
  </script>
</body>
</html>
