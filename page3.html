<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>চিঠি 📝</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .notes-wrapper{max-width:560px;width:100%}
    .section-header{text-align:center;margin-bottom:20px}

    /* ===== Slider ===== */
    .slider-outer{
      width:100%;
      overflow:hidden;
      border-radius:18px;
      position:relative;
    }
    .slider-track{
      display:flex;
      width:100%;
      transition:transform 0.45s cubic-bezier(0.25,0.46,0.45,0.94);
      will-change:transform;
    }
    .note-slide{
      /* JS দিয়ে pixel width set হবে — 100% reliable */
      flex:0 0 auto;
      box-sizing:border-box;
    }
    .note-img-wrap{
      background:var(--bg-card);
      border:1px solid var(--border-soft);
      border-radius:16px;
      overflow:hidden;
      padding:8px;
      box-shadow:0 8px 32px rgba(0,0,0,0.3);
      width:100%;
    }
    .note-img-wrap img{
      width:100%;
      height:auto;           /* height auto — ছবি কাটবে না */
      max-height:65vh;
      object-fit:contain;
      border-radius:10px;
      display:block;
    }
    .note-label{
      font-size:0.78rem;
      color:var(--text-dim);
      text-align:center;
      margin-top:10px;
      letter-spacing:0.5px;
    }
    .note-placeholder{
      background:var(--bg-card);
      border:1px dashed var(--border-soft);
      border-radius:16px;
      padding:48px 32px;
      text-align:center;
      color:var(--text-dim);
      width:100%;
    }
    .note-placeholder .icon{font-size:2.5rem;display:block;margin-bottom:10px}

    /* navigation */
    .note-nav{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:16px}
    .note-nav-btn{
      background:var(--bg-card);
      border:1px solid var(--border-soft);
      border-radius:50%;
      width:52px;height:52px;
      font-size:1.2rem;
      color:var(--accent-pink);
      cursor:pointer;
      transition:all 0.25s ease;
      display:flex;align-items:center;justify-content:center;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
      user-select:none;
    }
    .note-nav-btn:active{transform:scale(0.92)!important}
    .note-nav-btn:hover{background:rgba(244,167,185,0.15);transform:scale(1.08)}
    .note-nav-btn:disabled{opacity:0.3;cursor:default;transform:none!important}
    .note-counter{font-size:0.9rem;color:var(--text-dim);min-width:60px;text-align:center}

    /* dots */
    .progress-dots{display:flex;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap}
    .dot{
      width:8px;height:8px;border-radius:50%;
      background:var(--text-dim);
      transition:background 0.3s ease,transform 0.3s ease;
      cursor:pointer;
    }
    .dot.active{background:var(--accent-pink);transform:scale(1.4)}

    @media(max-height:600px) and (orientation:landscape){
      .note-img-wrap img{max-height:45vh}
    }
  </style>
</head>
<body style="opacity:0">
  <div class="stars-bg" aria-hidden="true"></div>
  <div class="page-indicator">3 / 5</div>

  <!-- 🎵 Channa Mereya -->
  <div class="music-player" id="musicPlayer">
    <button class="music-btn" id="playBtn" aria-label="সুর চালাও">▶</button>
    <span class="music-label" id="musicLabel">সুর চালাও</span>
  </div>

  <div class="page-wrapper" style="padding-top:40px;padding-bottom:40px">
    <div class="content-layer notes-wrapper">
      <div class="section-header fade-in">
        <span style="font-size:2rem;display:block;margin-bottom:8px" aria-hidden="true">✍️</span>
        <h2>তোমার জন্য লেখা কিছু কথা</h2>
        <div class="divider"></div>
        <p>কিছু কথা কাগজে লিখে রেখেছিলাম।</p>
      </div>

      <div class="slider-outer fade-in" id="sliderOuter">
        <div class="slider-track" id="sliderTrack"></div>
      </div>

      <div class="progress-dots" id="progressDots"></div>

      <div class="note-nav fade-in">
        <button class="note-nav-btn" id="prevNote" aria-label="আগের চিঠি">←</button>
        <span class="note-counter" id="noteCounter">1 / 6</span>
        <button class="note-nav-btn" id="nextNote" aria-label="পরের চিঠি">→</button>
      </div>

      <div class="nav-row fade-in" style="margin-top:28px">
        <button class="btn btn-primary" onclick="goToPage('page4.html')">ভিডিও দেখি →</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    const NOTES = [
      { src: 'assets/notes/note1.png', label: 'চিঠি ১' },
      { src: 'assets/notes/note2.png', label: 'চিঠি ২' },
      { src: 'assets/notes/note3.png', label: 'চিঠি ৩' },
      { src: 'assets/notes/note4.png', label: 'চিঠি ৪' },
      { src: 'assets/notes/note5.png', label: 'চিঠি ৫' },
      { src: 'assets/notes/note6.png', label: 'চিঠি ৬' },
    ];

    let current = 0;
    const outer   = document.getElementById('sliderOuter');
    const track   = document.getElementById('sliderTrack');
    const dotsEl  = document.getElementById('progressDots');
    const counter = document.getElementById('noteCounter');
    const prevBtn = document.getElementById('prevNote');
    const nextBtn = document.getElementById('nextNote');

    /* ---- pixel width সেট করো — % এ bug হয় mobile-এ ---- */
    function getSlideWidth() {
      return outer.getBoundingClientRect().width;
    }

    function setSlideWidths() {
      const w = getSlideWidth();
      document.querySelectorAll('.note-slide').forEach(slide => {
        slide.style.width = w + 'px';
      });
      /* position update */
      track.style.transition = 'none';
      track.style.transform  = `translateX(-${current * getSlideWidth()}px)`;
      requestAnimationFrame(() => {
        track.style.transition = 'transform 0.45s cubic-bezier(0.25,0.46,0.45,0.94)';
      });
    }

    function buildSlides() {
      track.innerHTML = '';
      dotsEl.innerHTML = '';

      NOTES.forEach((note, i) => {
        const slide = document.createElement('div');
        slide.className = 'note-slide';
        slide.setAttribute('role', 'group');
        slide.setAttribute('aria-label', `চিঠি ${i+1}`);

        if (note.src) {
          slide.innerHTML = `
            <div class="note-img-wrap">
              <img src="${note.src}" alt="চিঠি ${i+1}"
                onerror="this.parentElement.innerHTML='<div class=note-placeholder><span class=icon>📝</span><p>ছবি লোড হয়নি</p></div>'" />
            </div>
            ${note.label ? `<p class="note-label">${note.label}</p>` : ''}
          `;
        } else {
          slide.innerHTML = `
            <div class="note-placeholder">
              <span class="icon">📝</span>
              <p>assets/notes/ ফোল্ডারে ছবি রাখো</p>
            </div>`;
        }
        track.appendChild(slide);

        const dot = document.createElement('div');
        dot.className = 'dot' + (i === 0 ? ' active' : '');
        dot.addEventListener('click', () => goTo(i));
        dotsEl.appendChild(dot);
      });

      /* width set হওয়ার পর slide width দাও */
      requestAnimationFrame(() => {
        setSlideWidths();
        updateUI();
      });
    }

    function updateUI() {
      const w = getSlideWidth();
      track.style.transform = `translateX(-${current * w}px)`;
      counter.textContent   = `${current + 1} / ${NOTES.length}`;
      prevBtn.disabled = (current === 0);
      nextBtn.disabled = (current === NOTES.length - 1);
      document.querySelectorAll('.dot').forEach((d, i) =>
        d.classList.toggle('active', i === current)
      );
    }

    function goTo(index) {
      current = Math.max(0, Math.min(NOTES.length - 1, index));
      updateUI();
    }

    prevBtn.addEventListener('click', () => goTo(current - 1));
    nextBtn.addEventListener('click', () => goTo(current + 1));

    /* ---- resize হলে width recalculate ---- */
    window.addEventListener('resize', () => {
      setSlideWidths();
      updateUI();
    });

    /* ---- Swipe ---- */
    let touchStartX = 0, touchStartY = 0, isHorizontal = false;

    outer.addEventListener('touchstart', e => {
      touchStartX  = e.changedTouches[0].clientX;
      touchStartY  = e.changedTouches[0].clientY;
      isHorizontal = false;
    }, { passive: true });

    outer.addEventListener('touchmove', e => {
      const dx = Math.abs(e.changedTouches[0].clientX - touchStartX);
      const dy = Math.abs(e.changedTouches[0].clientY - touchStartY);
      if (!isHorizontal && dx > dy && dx > 8) isHorizontal = true;
    }, { passive: true });

    outer.addEventListener('touchend', e => {
      if (!isHorizontal) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 44) {
        goTo(dx < 0 ? current + 1 : current - 1);
      }
      isHorizontal = false;
    }, { passive: true });

    /* ---- Keyboard ---- */
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft')  goTo(current - 1);
      if (e.key === 'ArrowRight') goTo(current + 1);
    });

    /* ---- Init ---- */
    document.addEventListener('DOMContentLoaded', () => {
      buildSlides();
      initYouTubePlayer('bzSTpdcs-EI');
    });
  </script>
</body>
</html>
