<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>শুধু তোমার জন্য 🌸</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .welcome-box{text-align:center;padding:48px 28px;max-width:460px;width:100%}
    .welcome-emoji{font-size:clamp(3rem,12vw,5rem);display:block;margin-bottom:20px;animation:pulse 2.5s ease-in-out infinite}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
    .welcome-title{
      font-family:'Dancing Script',cursive;
      font-size:clamp(1.8rem,7vw,3rem);
      color:var(--accent-pink);line-height:1.3;
      margin-bottom:16px;
    }
    .welcome-sub{font-size:clamp(0.95rem,3.2vw,1.08rem);color:var(--text-soft);line-height:1.8;margin-bottom:32px}
    .petal-row{font-size:1.1rem;letter-spacing:8px;color:var(--accent-pink);opacity:0.55;margin:20px 0 28px}
  </style>
</head>
<body style="opacity:0">
  <div class="stars-bg" aria-hidden="true"></div>

  <div class="page-wrapper">
    <div class="content-layer">
      <div class="welcome-box fade-in">
        <span class="welcome-emoji" aria-hidden="true">🌸</span>
        <h1 class="welcome-title">শুধু তোমার জন্য</h1>
        <div class="petal-row" aria-hidden="true">✿ · ✦ · ✿</div>
        <p class="welcome-sub">একটু সময় নিয়ে দেখো —<br/>প্রতিটা পেজে কিছু না কিছু আছে।</p>
        <button class="btn btn-primary" onclick="goToPage('page1.html')">শুরু করি →</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      createHearts(6);
    });
  </script>
</body>
</html>
